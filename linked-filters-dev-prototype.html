<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linked filters — dev prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#00897b; --pr-hover:#00796b; --pr-05:rgba(0,137,123,.06); --pr-10:rgba(0,137,123,.10);
  --logo:#0f2440; --bg:#f8fafb; --surface:#fff;
  --n800:#1f2937; --n700:#374151; --n600:#4b5563; --n500:#6b7280; --n400:#9ca3af; --n300:#cbd5e1;
  --n200:#e5e7eb; --n100:#f3f4f6; --n50:#f9fafb;
  --amber-bg:#fffbeb; --amber-bd:#fde68a; --amber-tx:#92400e;
  --sh-sm:0 1px 2px rgba(0,0,0,.05); --sh-dd:0 8px 24px rgba(0,0,0,.12); --sh-modal:0 20px 60px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Anek Latin',system-ui,sans-serif;color:var(--n800);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ---- dev strip ---- */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:#0f1115;color:#9aa3af;padding:9px 20px;font-size:12px}
.strip b{color:#fff;font-weight:600}
.strip .grp{display:flex;align-items:center;gap:6px}
.strip .sep{width:1px;height:16px;background:#2a2f3a}
.strip .lbl{color:#6b7280}
.strip button{background:none;border:none;color:#c6ccd6;border-radius:6px;padding:4px 9px;font-size:12px}
.strip button:hover{background:#242a35}
.strip button.on{background:#fff;color:#0f1115;font-weight:600}
.strip select{background:#242a35;color:#e5e7eb;border:none;border-radius:6px;padding:4px 7px;font-size:12px}
.strip .apply{background:#fff;color:#0f1115;font-weight:600}
.strip .right{margin-left:auto;color:#5b6371}

/* ---- shell ---- */
.app{display:flex;flex-direction:column;height:calc(100vh - 38px);min-height:620px}
.header{display:flex;align-items:center;justify-content:space-between;height:56px;background:var(--surface);border-bottom:1px solid var(--n200);padding:0 20px;flex-shrink:0}
.header .logo{font-size:24px;font-weight:700;color:var(--logo);letter-spacing:-.3px}
.header .right{display:flex;align-items:center;gap:16px}
.header .org{font-size:14px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pr);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.body{display:flex;flex:1;overflow:hidden}
.rail{width:52px;background:var(--surface);border-right:1px solid var(--n200);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;flex-shrink:0}
.rail .ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n500)}
.rail .ic.on{background:var(--pr-10);color:var(--pr)}
.rail .ic svg{width:19px;height:19px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--n200);padding:10px 20px;flex-shrink:0}
.toolbar .back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--n600);background:none;border:none}
.toolbar .title{border-left:1px solid var(--n200);padding-left:16px}
.toolbar .title .t{font-size:15px;font-weight:600}
.toolbar .title .d{font-size:11px;color:var(--n400)}
.toolbar .mid{margin:0 auto;display:flex;align-items:center;gap:4px;color:var(--n600)}
.toolbar .mid .tb{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;background:none;border:none;color:var(--n600)}
.toolbar .mid .tb:hover{background:var(--n50)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent;transition:.15s}
.btn svg{width:16px;height:16px}
.btn-pr{background:var(--pr);color:#fff;padding:7px 16px}
.btn-pr:hover{background:var(--pr-hover)}
.btn-out{background:var(--surface);border-color:var(--n200);color:var(--n700);padding:7px 16px}
.btn-out:hover{background:var(--n50)}

/* ---- filters panel ---- */
.panel{width:344px;background:var(--surface);border-right:1px solid var(--n200);display:flex;flex-direction:column;flex-shrink:0}
.panel-head{padding:16px 16px 12px}
.panel-head-top{display:flex;align-items:center;justify-content:space-between}
.panel-head-top .ttl{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
.panel-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n500);background:none;border:1px solid transparent;transition:.15s}
.icon-btn:hover{background:var(--n50);color:var(--n700)}
.icon-btn.bordered{border-color:var(--n200)}
.icon-btn svg{width:18px;height:18px}
.add-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border:1px solid var(--n200);border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;color:var(--n700)}
.add-btn:hover{background:var(--n50)}
.add-btn svg{width:15px;height:15px}
.panel-sub{font-size:12px;color:var(--n400);margin-top:3px}
.apply-row{display:flex;gap:8px;margin-top:12px}
.apply-row .apply{flex:1;height:40px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.apply-row .apply:hover{background:var(--pr-hover)}
.apply-row .apply svg{width:16px;height:16px}
.reset{width:40px;height:40px;border:1px solid var(--n200);border-radius:8px;background:var(--surface);color:var(--n500);display:flex;align-items:center;justify-content:center}
.reset:hover{background:var(--n50)}
.reset svg{width:16px;height:16px}
.list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}

/* notice banner */
.notice{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--amber-bd);background:var(--amber-bg);border-radius:8px;padding:10px;font-size:12px;line-height:1.45;color:var(--amber-tx)}
.notice svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.notice .x{margin-left:auto;color:#b45309;background:none;border:none;flex-shrink:0}
.notice .x svg{width:14px;height:14px}

/* filter card */
.card{background:var(--surface);border:1px solid var(--n200);border-radius:8px;padding:12px;box-shadow:var(--sh-sm);position:relative}
.card.drag-over{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr-10)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-lbl{display:flex;align-items:center;gap:8px}
.card-lbl .name{font-size:13px;font-weight:600;color:var(--n800)}
.badge{border-radius:20px;background:var(--n100);color:var(--n600);font-size:11px;font-weight:600;padding:1px 7px}
.grip{color:var(--n300);background:none;border:none;opacity:0;cursor:grab;transition:.15s}
.card:hover .grip,.group:hover .grip{opacity:1}
.grip svg{width:16px;height:16px}
.inrow{display:flex;gap:8px}
.plain{width:100%;border:1px solid var(--n200);border-radius:8px;padding:8px 11px;font-size:14px;color:var(--n400);background:var(--surface)}

/* multiselect */
.ms{position:relative}
.ms-field{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:38px;border:1px solid var(--n200);border-radius:8px;padding:6px 9px;background:var(--surface);cursor:pointer}
.ms-field:hover{border-color:#d5dadf}
.ms-field.open{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-10)}
.ms-ph{display:flex;align-items:center;gap:6px;color:var(--n400);font-size:14px}
.ms-ph svg{width:14px;height:14px}
.ms-tag{display:inline-flex;align-items:center;gap:5px;background:var(--pr-10);color:var(--pr);border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:500}
.ms-tag svg{width:11px;height:11px}
.ms-caret{margin-left:auto;color:var(--n400);display:flex}
.ms-caret svg{width:16px;height:16px}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--n200);border-radius:8px;box-shadow:var(--sh-dd);padding:5px;max-height:220px;overflow-y:auto}
.ms-opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;font-size:14px;cursor:pointer}
.ms-opt:hover{background:var(--n50)}
.ms-opt.sel{background:var(--pr-05)}
.ms-cb{width:17px;height:17px;border:1.5px solid var(--n300);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ms-opt.sel .ms-cb{background:var(--pr);border-color:var(--pr)}
.ms-cb svg{width:11px;height:11px;color:#fff;display:none}
.ms-opt.sel .ms-cb svg{display:block}
.ms-empty{padding:14px;text-align:center;color:var(--n400);font-size:13px}
.ms-div{height:1px;background:var(--n100);margin:4px 0}

/* group block */
.group{border:1px solid var(--n200);border-radius:8px;background:var(--surface)}
.group-head{display:flex;align-items:center;justify-content:space-between;background:var(--n50);padding:8px 12px;border-radius:7px 7px 0 0}
.group-head .gl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--n700)}
.group-head .gl .badge{background:var(--n200)}
.group-head .ga{display:flex;align-items:center;gap:2px;color:var(--n400)}
.group-head .ga button{background:none;border:none;color:var(--n400);border-radius:4px;padding:4px;display:flex}
.group-head .ga button:hover{background:var(--n100);color:var(--n700)}
.group-head .ga svg{width:14px;height:14px}
.group-body{padding:12px;display:flex;flex-direction:column;gap:12px}
.group-body .mlbl{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.group-body .mlbl .name{font-size:13px;font-weight:600;color:var(--n800)}

/* canvas */
.canvas{flex:1;overflow-y:auto;padding:20px}
.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--n200);margin-bottom:16px}
.tab{padding:8px 16px;font-size:14px;font-weight:600;color:var(--pr);border-bottom:2px solid var(--pr)}
.tabs .plus{color:var(--n400);display:flex}
.tabs .plus svg{width:16px;height:16px}
.vgrid{display:flex;flex-direction:column;gap:16px}
.vcard{background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:20px}
.vcard .kl{font-size:13px;color:var(--n500)}
.vcard .kv{font-size:28px;font-weight:700;margin-top:2px}
.vhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.vhead h2{font-size:16px;font-weight:600}
.vhead .rows{font-size:12px;color:var(--n400)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:12px;font-weight:600;color:var(--n500);text-transform:uppercase;letter-spacing:.04em;padding:8px 0;border-bottom:1px solid var(--n200)}
tbody td{font-size:14px;padding:11px 0;border-bottom:1px solid var(--n100)}
.empty{padding:56px 20px;text-align:center}
.empty .et{font-weight:600}
.empty .eb{font-size:14px;color:var(--n400);margin-top:4px;max-width:320px;margin-left:auto;margin-right:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--sh-modal);width:100%;max-width:480px;padding:24px;max-height:88vh;overflow:auto}
.modal h2{font-size:20px;font-weight:700;letter-spacing:-.2px}
.modal .desc{font-size:13.5px;color:var(--n500);line-height:1.5;margin-top:6px}
.modal .close{position:absolute;float:right;margin-top:-30px;color:var(--n400);background:none;border:none}
.m-table{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--n500);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 4px}
.m-table svg{width:12px;height:12px}
.m-note-dim{font-size:11.5px;color:var(--n400);padding-left:20px;margin-bottom:2px}
.m-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:6px}
.m-row:not(.dis):hover{background:var(--n50);cursor:pointer}
.m-row.dis{opacity:.55;cursor:not-allowed}
.m-cb{width:18px;height:18px;border:1.5px solid var(--n300);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.m-row.ck .m-cb{background:var(--pr);border-color:var(--pr)}
.m-cb svg{width:12px;height:12px;color:#fff;display:none}
.m-row.ck .m-cb svg{display:block}
.m-row .ml{font-size:14px}
.m-note{margin-top:10px;border:1px solid var(--amber-bd);background:var(--amber-bg);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--amber-tx)}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.m-cancel{background:var(--surface);border:1px solid #ef5350;color:#ef5350;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600}
.m-cancel:hover{background:#fef2f2}
.m-save{background:var(--pr);border:none;color:#fff;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600}
.m-save:hover{background:var(--pr-hover)}
.m-save:disabled{opacity:.5;cursor:not-allowed}

/* toast */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-70px);background:#e7f6ec;border:1px solid #b7e2c4;color:#1b7a3e;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:var(--sh-dd);z-index:300;opacity:0;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.tip{color:var(--n400);font-size:13px}
</style>
</head>
<body>

<div class="strip">
  <b>Dev prototype</b>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Canvas</span>
    <button data-canvas="live" class="on">Live</button>
    <button data-canvas="noMatch">No match (filters)</button>
    <button data-canvas="noSource">No source data</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Edge case</span><span class="lbl">change type of</span>
    <select id="edgeTarget"><option value="">(no group)</option></select>
    <span class="lbl">to</span>
    <select id="edgeType"><option value="date">Date</option><option value="number">Number</option></select>
    <button class="apply" id="edgeApply">Change type</button>
  </div>
  <span class="right">Design matches the app · leave the React route live</span>
</div>

<div class="app">
  <div class="header">
    <div class="logo">Dalgo</div>
    <div class="right">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span class="org">Dalgo bigquery</span>
      <div class="avatar">AM</div>
    </div>
  </div>
  <div class="body">
    <div class="rail">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></div>
      <div class="ic on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8L12 14.6 7 18.2l1.9-5.8L4 8.8h6.1z"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.2L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.2a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    </div>
    <div class="main">
      <div class="toolbar">
        <button class="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back</button>
        <div class="title"><div class="t">Untitled Dashboard</div><div class="d">+ Add description</div></div>
        <div class="mid">
          <button class="tb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg> Add chart</button>
          <button class="tb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg> Add KPI</button>
          <button class="tb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg> Add text</button>
        </div>
        <button class="btn btn-pr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Save</button>
        <button class="btn btn-out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> View</button>
      </div>
      <div class="body" style="flex:1">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-head-top">
              <div class="ttl">Filters <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></div>
              <div class="panel-actions">
                <button class="icon-btn bordered" id="ctaBtn" title="Linked filters" aria-label="Linked filters">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="17.5" r="3" fill="currentColor" stroke="none"/><circle cx="17.5" cy="6.5" r="3" fill="currentColor" stroke="none"/><path d="M6.5 14.5V10a3.5 3.5 0 0 1 3.5-3.5H13"/></svg>
                </button>
                <button class="add-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> ADD</button>
                <button class="icon-btn" title="Collapse panel" aria-label="Collapse panel">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/></svg>
                </button>
              </div>
            </div>
            <div class="panel-sub" id="panelSub">6 filters</div>
            <div class="apply-row">
              <button class="apply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> APPLY</button>
              <button class="reset" id="resetBtn" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg></button>
            </div>
          </div>
          <div class="list" id="list"></div>
        </div>
        <div class="canvas" id="canvas"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- icons ---------------- */
const IC={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  caret:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
};

/* ---------------- data ---------------- */
const DATA=[
 {state:'Karnataka',city:'Bangalore',name:'Rahul'},{state:'Karnataka',city:'Bangalore',name:'Asha'},
 {state:'Karnataka',city:'Mysore',name:'Kiran'},{state:'Maharashtra',city:'Pune',name:'Priya'},
 {state:'Maharashtra',city:'Pune',name:'Geeta'},{state:'Maharashtra',city:'Mumbai',name:'Sachin'},
 {state:'Maharashtra',city:'Mumbai',name:'Priya'},{state:'Tamil Nadu',city:'Chennai',name:'Priya'},
 {state:'Tamil Nadu',city:'Coimbatore',name:'Meena'},{state:'Uttar Pradesh',city:'Lucknow',name:'Meena'},
 {state:'Uttar Pradesh',city:'Kanpur',name:'Amit'},{state:'West Bengal',city:'Kolkata',name:'Amit'},
 {state:'West Bengal',city:'Kolkata',name:'Mohan'},{state:'Gujarat',city:'Ahmedabad',name:'Ravi'},
 {state:'Madhya Pradesh',city:'Bhopal',name:'Sanjay'},
];
const TA='Health camp visits', TB='Follow up visits';
const FILTERS=[
 {id:'state',label:'State',table:TA,type:'dropdown',col:'state'},
 {id:'city',label:'City',table:TA,type:'dropdown',col:'city'},
 {id:'name',label:'Name',table:TA,type:'dropdown',col:'name'},
 {id:'cost',label:'Cost Spent',table:TA,type:'number'},
 {id:'date',label:'Follow Up Date',table:TA,type:'date'},
 {id:'fid',label:'Follow Up Id',table:TB,type:'dropdown',opts:['1','2','3','4','5','6']},
];
const byId=id=>FILTERS.find(f=>f.id===id);
const distinct=a=>[...new Set(a)].sort((x,y)=>(''+x).localeCompare(''+y,undefined,{numeric:true}));
const tlabel=t=>t==='number'?'Number':t==='date'?'Date':'Value';
const GROUP='__group__';

/* ---------------- state ---------------- */
const S={linked:[],order:['state','city','name','cost','date','fid'],sel:{state:[],city:[],name:[],fid:[]},
  typeOf:{},canvas:'live',notice:null,open:null,modal:false,draft:new Set(),edgeType:'date',edgeTarget:''};
const et=id=>S.typeOf[id]||byId(id).type;
function narrowSet(){return S.linked.filter(id=>et(id)==='dropdown'&&byId(id).col);}
function options(id){const f=byId(id);if(et(id)!=='dropdown')return[];if(!f.col)return f.opts||[];
  const ns=narrowSet();if(!ns.includes(id))return distinct(DATA.map(r=>r[f.col]));
  const others=ns.filter(x=>x!==id);
  const rows=DATA.filter(r=>others.every(o=>{const s=S.sel[o]||[];return s.length===0||s.includes(r[byId(o).col]);}));
  return distinct(rows.map(r=>r[f.col]));}
function resultRows(){const cols=['state','city','name'];return DATA.filter(r=>cols.every(c=>(S.sel[c]||[]).length===0||S.sel[c].includes(r[c])));}

/* ---------------- render ---------------- */
function render(){renderStrip();renderList();renderCanvas();
  const n=narrowSet().length;document.getElementById('panelSub').textContent='6 filters'+(n>1?' · '+n+' linked':'');}

function renderStrip(){
  document.querySelectorAll('.strip [data-canvas]').forEach(b=>b.classList.toggle('on',b.dataset.canvas===S.canvas));
  const sel=document.getElementById('edgeTarget');
  const linkedDd=S.linked;
  const eff=linkedDd.includes(S.edgeTarget)?S.edgeTarget:(linkedDd[0]||'');
  sel.innerHTML = linkedDd.length<2 ? '<option value="">(no group)</option>' : linkedDd.map(id=>`<option value="${id}">${byId(id).label}</option>`).join('');
  sel.value=eff; sel.disabled=linkedDd.length<2;
  document.getElementById('edgeType').disabled=linkedDd.length<2;
  document.getElementById('edgeApply').disabled=linkedDd.length<2;
}

function msHTML(id){
  const f=byId(id);const opts=options(id);const chosen=S.sel[id]||[];const open=S.open===id;
  let field='<div class="ms-field'+(open?' open':'')+'" data-ms="'+id+'">';
  if(chosen.length===0) field+='<span class="ms-ph">'+IC.search+' Search…</span>';
  else field+=chosen.map(v=>'<span class="ms-tag" data-tag="'+id+'|'+v+'">'+v+IC.x+'</span>').join('');
  field+='<span class="ms-caret">'+IC.caret+'</span></div>';
  let panel='';
  if(open){
    panel='<div class="ms-panel">';
    if(opts.length===0) panel+='<div class="ms-empty">No matching options</div>';
    else{const all=opts.every(o=>chosen.includes(o));
      panel+='<div class="ms-opt'+(all?' sel':'')+'" data-all="'+id+'"><span class="ms-cb">'+IC.check+'</span> Select all</div><div class="ms-div"></div>';
      panel+=opts.map(o=>{const s=chosen.includes(o);return '<div class="ms-opt'+(s?' sel':'')+'" data-opt="'+id+'|'+o+'"><span class="ms-cb">'+IC.check+'</span> '+o+'</div>';}).join('');}
    panel+='</div>';
  }
  return '<div class="ms">'+field+panel+'</div>';
}
function cardControl(id){const t=et(id);
  if(t==='date')return '<input class="plain" placeholder="Select date range" disabled>';
  if(t==='number')return '<div class="inrow"><input class="plain" placeholder="Min" disabled><input class="plain" placeholder="Max" disabled></div>';
  return msHTML(id);}
function badge(n){return n>0?'<span class="badge">'+n+'</span>':'';}

function renderList(){
  const list=document.getElementById('list');let html='';
  if(S.notice){html+='<div class="notice">'+IC.info+'<span>'+S.notice+'</span><button class="x" id="noticeX">'+IC.x+'</button></div>';}
  S.order.forEach(slot=>{
    if(slot===GROUP){
      html+='<div class="group" draggable="true" data-slot="'+GROUP+'">';
      html+='<div class="group-head"><div class="gl">Linked filters <span class="badge">'+S.linked.length+'</span></div>'+
            '<div class="ga"><button data-edit="1" title="Edit">'+IC.pencil+'</button></div></div>';
      html+='<div class="group-body">';
      S.linked.forEach(id=>{const c=(S.sel[id]||[]).length;
        html+='<div><div class="mlbl"><span class="name">'+byId(id).label+'</span>'+badge(c)+'</div>'+msHTML(id)+'</div>';});
      html+='</div></div>';
    }else{
      const f=byId(id=slot);const t=et(id);const c=t==='dropdown'?(S.sel[id]||[]).length:0;
      html+='<div class="card" draggable="true" data-slot="'+id+'">'+
            '<div class="card-top"><div class="card-lbl"><span class="name">'+f.label+'</span>'+badge(c)+'</div>'+
            '<button class="grip" data-drag="1">'+IC.grip+'</button></div>'+cardControl(id)+'</div>';
    }
  });
  list.innerHTML=html;
  bindList();
}

function renderCanvas(){
  const el=document.getElementById('canvas');const rows=resultRows();
  const total=S.canvas==='live'?rows.length:0;
  let body;
  if(S.canvas==='noSource'){body='<div class="empty"><div class="et">No data to display yet</div><div class="eb">This chart’s table has no data. Check your source data or pipeline.</div></div>';}
  else if(S.canvas==='noMatch'||rows.length===0){body='<div class="empty"><div class="et">No data for the selected filters</div><div class="eb">Try removing a filter or choosing different values.</div></div>';}
  else{body='<table><thead><tr><th>State</th><th>City</th><th>Name</th></tr></thead><tbody>'+
    rows.slice(0,8).map(r=>'<tr><td>'+r.state+'</td><td>'+r.city+'</td><td>'+r.name+'</td></tr>').join('')+'</tbody></table>';}
  el.innerHTML='<div class="tabs"><div class="tab">Untitled Tab 1</div><div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div></div>'+
    '<div class="vgrid"><div class="vcard"><div class="kl">Total visits</div><div class="kv">'+total+'</div></div>'+
    '<div class="vcard"><div class="vhead"><h2>'+TA+'</h2><span class="rows">Showing '+total+' of 15 rows</span></div>'+body+'</div></div>';
}

/* ---------------- interactions ---------------- */
function toggleSel(id,v){const s=S.sel[id]||[];S.sel[id]=s.includes(v)?s.filter(x=>x!==v):[...s,v];render();}
function bindList(){
  document.querySelectorAll('[data-ms]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-tag]'))return;S.open=S.open===e.dataset.ms?null:e.dataset.ms;render();});
  document.querySelectorAll('[data-tag]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const[id,v]=e.dataset.tag.split('|');toggleSel(id,v);});
  document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const[id,v]=e.dataset.opt.split('|');toggleSel(id,v);});
  document.querySelectorAll('[data-all]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const id=e.dataset.all;const opts=options(id);const all=opts.every(o=>(S.sel[id]||[]).includes(o));S.sel[id]=all?(S.sel[id]||[]).filter(v=>!opts.includes(v)):[...new Set([...(S.sel[id]||[]),...opts])];render();});
  const nx=document.getElementById('noticeX');if(nx)nx.onclick=()=>{S.notice=null;render();};
  const ed=document.querySelector('[data-edit]');if(ed)ed.onclick=openModal;
  bindDrag();
}
let dragSlot=null;
function bindDrag(){
  document.querySelectorAll('.list [data-slot]').forEach(el=>{
    el.ondragstart=e=>{dragSlot=el.dataset.slot;e.dataTransfer.effectAllowed='move';};
    el.ondragover=e=>{e.preventDefault();el.classList.add('drag-over');};
    el.ondragleave=()=>el.classList.remove('drag-over');
    el.ondrop=e=>{e.preventDefault();el.classList.remove('drag-over');const to=el.dataset.slot;if(!dragSlot||dragSlot===to)return;
      const o=S.order,from=o.indexOf(dragSlot),t=o.indexOf(to);o.splice(t,0,o.splice(from,1)[0]);render();};
  });
}
document.addEventListener('click',e=>{if(S.open&&!e.target.closest('.ms')){S.open=null;render();}});

/* ---- modal ---- */
function openModal(){S.draft=new Set(S.linked);S.modal=true;drawModal();document.getElementById('overlay').classList.add('show');}
function closeModal(){S.modal=false;document.getElementById('overlay').classList.remove('show');}
function chosenTable(){for(const id of S.draft)if(et(id)==='dropdown')return byId(id).table;return null;}
function drawModal(){
  const m=document.getElementById('modal');const ct=chosenTable();const tables=[...new Set(FILTERS.map(f=>f.table))];
  let h='<button class="close" onclick="closeModal()">'+IC.x+'</button><h2>Link filters</h2>'+
    '<div class="desc">Select the filters that should work together. When one filter changes, the available values in the others will update accordingly. You can link dropdown filters from one table.</div>';
  tables.forEach(tbl=>{const dim=ct&&tbl!==ct;
    h+='<div class="m-table" style="'+(dim?'opacity:.55':'')+'">'+IC.table+' '+tbl+'</div>';
    if(dim)h+='<div class="m-note-dim">Link filters from one table at a time</div>';
    FILTERS.filter(f=>f.table===tbl).forEach(f=>{const typeDis=et(f.id)!=='dropdown';const dis=typeDis||dim;const ck=S.draft.has(f.id);
      h+='<div class="m-row'+(ck?' ck':'')+(dis?' dis':'')+'" '+(dis?'':'data-mrow="'+f.id+'"')+' style="'+(dim?'opacity:.55':'')+'"><span class="m-cb">'+IC.check+'</span><span class="ml" style="'+(dis?'color:var(--n400)':'')+'">'+f.label+'</span></div>';});
  });
  h+='<div class="m-note">Date and number filters can’t be linked.</div>';
  const cnt=[...S.draft].filter(id=>et(id)==='dropdown').length;
  const lbl=(cnt<2&&S.linked.length)?'Unlink':'Save';
  h+='<div class="m-foot"><button class="m-cancel" onclick="closeModal()">Cancel</button><button class="m-save" id="mSave" '+((cnt!==0&&cnt<2)?'disabled':'')+'>'+lbl+'</button></div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-mrow]').forEach(e=>e.onclick=()=>{const id=e.dataset.mrow;if(S.draft.has(id))S.draft.delete(id);else S.draft.add(id);drawModal();});
  document.getElementById('mSave').onclick=saveLink;
}
function flatten(){const o=[];S.order.forEach(s=>{if(s===GROUP)o.push(...S.linked);else o.push(s);});return o;}
function groupOrder(flat,members){const o=[];let ins=false;flat.forEach(s=>{if(members.includes(s)){if(!ins){o.push(GROUP);ins=true;}}else o.push(s);});return o;}
function saveLink(){let ids=[...S.draft].filter(id=>et(id)==='dropdown');const ft=ids.length?byId(ids[0]).table:null;ids=ids.filter(id=>byId(id).table===ft);
  const flat=flatten();if(ids.length<2){S.linked=[];S.order=flat;}else{S.linked=ids;S.order=groupOrder(flat,ids);}closeModal();render();toast(ids.length<2?'Filters unlinked':'Filters linked');}

/* ---- edge case ---- */
function changeType(id,nt){S.typeOf[id]=nt;
  if(nt!=='dropdown'&&S.linked.includes(id)){const rem=S.linked.filter(x=>x!==id);const flat=flatten();
    if(rem.length>=2){S.linked=rem;S.order=groupOrder(flat,rem);}else{S.linked=[];S.order=flat;}
    S.notice='“'+byId(id).label+'” was removed from Linked filters — its type changed to '+tlabel(nt)+', and '+tlabel(nt).toLowerCase()+' filters can’t be linked.'+(rem.length<2?' The group was dissolved because only one filter was left.':'');}
  render();}

/* ---- misc ---- */
let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

document.getElementById('ctaBtn').onclick=openModal;
document.getElementById('resetBtn').onclick=()=>{S.sel={state:[],city:[],name:[],fid:[]};S.open=null;render();};
document.querySelectorAll('.strip [data-canvas]').forEach(b=>b.onclick=()=>{S.canvas=b.dataset.canvas;render();});
document.getElementById('edgeTarget').onchange=e=>S.edgeTarget=e.target.value;
document.getElementById('edgeType').onchange=e=>S.edgeType=e.target.value;
document.getElementById('edgeApply').onclick=()=>{const sel=document.getElementById('edgeTarget');const id=sel.value||S.linked[0];if(id)changeType(id,S.edgeType);};
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

render();
</script>
</body>
</html>
